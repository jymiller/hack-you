# Render Blueprint — deploys the Covenant Sentinel web service.
# Dashboard → New → Blueprint → connect this repo → Render reads this file → Apply.
services:
  - type: web
    name: covenant-sentinel
    runtime: node
    plan: free # upgrade to "starter" in the dashboard for the live demo (no cold starts; your $50 covers it)
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Set this as a secret in the dashboard → live You.com. Without it the app still runs,
      # in labelled fallback mode (Search → SYNTHETIC, ARI → the genuine PRERUN cache).
      - key: YDC_API_KEY
        sync: false
      # Parasail inference (OpenAI-compatible). Set the key as a secret in the dashboard.
      # PARASAIL_MODEL is not secret — pinned to the serverless GLM-5.2 id (no dot in "52").
      - key: PARASAIL_API_KEY
        sync: false
      - key: PARASAIL_MODEL
        value: parasail-glm-52
      - key: NODE_VERSION
        value: "22"
